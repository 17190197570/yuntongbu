name: Windows source validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-fixtures:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Check public source
        run: ./scripts/check-public-source.ps1
      - name: Configure MSVC and Windows SDK
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'MSVC x64 build tools not found.' }
          Import-Module (Join-Path $vsPath 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          ./scripts/build.ps1 -Configuration Release
      - name: Run isolated fixture checks
        run: |
          $validation = Join-Path $PWD 'artifacts/validation/public-ci'
          New-Item -ItemType Directory -Path $validation -Force | Out-Null
          $suites = @('test-unit', 'test-connections', 'test-phase2', 'test-phase3', 'test-cache', 'test-archive', 'test-product', 'test-health')
          foreach ($suite in $suites) {
            & pwsh -NoProfile -File (Join-Path $PWD "scripts/$suite.ps1") 2>&1 | Tee-Object -FilePath (Join-Path $validation "$suite.log")
            if ($LASTEXITCODE -ne 0) { throw "Fixture suite failed: $suite" }
          }
      - name: Upload fixture validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-fixture-validation
          path: artifacts/validation/public-ci/*.log
          if-no-files-found: warn
          retention-days: 14
